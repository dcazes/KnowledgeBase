# Parser Service — docker-compose (TEMPLATE)
# Docling (primary) + MinerU (scan/OCR fallback). CPU-capable; GPU optional.
# Output volume ./parsed shared with the ingest step. NOT deployed.

name: parser-service

networks:
  agent-net:
    external: true   # join the agent-stack network

volumes:
  parsed-data:

services:
  docling:
    build:
      context: .
      dockerfile: Dockerfile.docling
    container_name: parser-docling
    ports:
      - "5007:8000"   # HTTP API
    volumes:
      - ./in:/data/in:ro        # drop raw docs here
      - parsed-data:/data/out   # parsed markdown/json
    networks: [agent-net]
    restart: unless-stopped

  mineru:
    build:
      context: .
      dockerfile: Dockerfile.mineru
    container_name: parser-mineru
    ports:
      - "5008:8000"   # HTTP API
    volumes:
      - ./in:/data/in:ro
      - parsed-data:/data/out
    networks: [agent-net]
    restart: unless-stopped
    # GPU optional for OCR:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
