# Agent Stack — all-in-one prototype (TEMPLATE)
# Based on official compose structures (Firecrawl 6-svc, Graphiti MCP FalkorDB, Weaviate end-user, SearXNG, Camofox, Ollama, LiteLLM).
# Secrets are placeholders — fill .env before deploy. NOT deployed.

name: agent-stack

networks:
  agent-net:
    driver: bridge

volumes:
  redis-data:
  rabbitmq-data:
  postgres-data:
  fdb-data:
  weaviate-data:
  ollama-data:
  camofox-data:

services:
  # ─────────────── WEB SEARCH + SCRAPE ───────────────
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks: [agent-net]
    restart: unless-stopped

  firecrawl-api:
    # image: ghcr.io/mendableai/firecrawl:latest   # or build: ./firecrawl
    build:
      context: ./firecrawl
      dockerfile: Dockerfile
    container_name: firecrawl-api
    ports:
      - "3002:3002"
    environment:
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - POSTGRES_URL=postgresql://postgres:postgres@nuq-postgres:5432/firecrawl
      - FOUNDATIONDB_URL=foundationdb:4500
      - PLAYWRIGHT_SERVICE_URL=http://playwright-service:3000
      - SEARXNG_ENDPOINT=http://searxng:8080
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${FIRECRAWL_LLM_PROVIDER:-openai}
      - PORT=3002
    depends_on: [redis, rabbitmq, nuq-postgres, foundationdb, playwright-service]
    networks: [agent-net]
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: firecrawl-redis
    volumes: ["redis-data:/data"]
    networks: [agent-net]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: firecrawl-rabbitmq
    ports: ["15672:15672"]
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-firecrawl}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-CHANGE_ME}
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    networks: [agent-net]
    restart: unless-stopped

  nuq-postgres:
    image: ghcr.io/mendableai/firecrawl-postgres:latest
    container_name: firecrawl-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-CHANGE_ME}
      - POSTGRES_DB=firecrawl
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [agent-net]
    restart: unless-stopped

  playwright-service:
    image: ghcr.io/mendableai/playwright-service:latest
    container_name: firecrawl-playwright
    ports: ["3005:3000"]
    networks: [agent-net]
    restart: unless-stopped

  foundationdb:
    image: foundationdb/foundationdb:7.3.63
    container_name: firecrawl-fdb
    volumes: ["fdb-data:/var/fdb/data"]
    networks: [agent-net]
    restart: unless-stopped

  # ─────────────── HEADED STEALTH BROWSER ───────────────
  camofox:
    image: camofox-browser:135.0.1-x86_64
    container_name: camofox
    ports:
      - "9377:9377"   # API
      - "6080:6080"   # noVNC
    volumes: ["camofox-data:/home/camofox/.camofox"]
    networks: [agent-net]
    restart: unless-stopped

  # ─────────────── LOCAL MODELS (1060) ───────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports: ["11434:11434"]
    volumes: ["ollama-data:/root/.ollama"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks: [agent-net]
    restart: unless-stopped

  # ─────────────── FREE-TIER LLM PROXY (:4000) ───────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    ports: ["4000:4000"]
    volumes: ["./litellm/config.yaml:/app/config.yaml:ro"]
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    networks: [agent-net]
    restart: unless-stopped

  # ─────────────── MEMORY (Graphiti MCP, FalkorDB) ───────────────
  graphiti-mcp:
    image: getzep/graphiti-mcp:latest
    container_name: graphiti-mcp
    ports: ["8000:8000"]
    environment:
      - GRAPHITI_DB_PROVIDER=falkordb
      - FALKORDB_URL=bolt://falkordb:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TRANSPORT=sse
      - HOST=0.0.0.0
      - PORT=8000
    networks: [agent-net]
    restart: unless-stopped

  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb
    ports: ["6379:6379", "3000:3000"]
    networks: [agent-net]
    restart: unless-stopped

  # ─────────────── SEARCH BACKEND (Weaviate start) ───────────────
  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: weaviate
    ports: ["8087:8080"]
    volumes: ["weaviate-data:/var/lib/weaviate"]
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - ENABLE_MODULES=text2vec-ollama,reranker-cohere
      - DEFAULT_VECTORIZER_MODULE=none   # we embed via Ollama locally
      - CLUSTER_HOSTNAME=node1
    networks: [agent-net]
    restart: unless-stopped

# NOTE: routes between services use service names on agent-net.
# Host only needs: 8080 (SearXNG), 3002 (Firecrawl), 9377/6080 (Camofox),
# 11434 (Ollama), 4000 (LiteLLM), 8000 (Graphiti MCP), 8087 (Weaviate).
