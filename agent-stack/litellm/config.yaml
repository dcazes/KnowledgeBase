# LiteLLM proxy config — the :4000 free-tier gateway
# Exposes OpenAI-compatible endpoints; Hermes/OpenCode point their base_url here.
# Models route to free-tier providers. Add/remove as free tiers change.

model_list:
  # ── OpenRouter (general, permanent free models) ──
  - model_name: openrouter-free
    litellm_params:
      model: openrouter/meta-llama/llama-3.1-8b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-google-free
    litellm_params:
      model: openrouter/google/gemma-2-9b-it:free
      api_key: os.environ/OPENROUTER_API_KEY

  # ── Groq (fast, high daily limit on 8B) ──
  - model_name: groq-fast
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY

  # ── Gemini (Google AI Studio free tier) ──
  - model_name: gemini-free
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # ── Local Ollama (tiny model, offline) ──
  - model_name: ollama-local
    litellm_params:
      model: ollama/qwen2.5-coder:3b
      api_base: http://ollama:11434

  # ── Local embeddings (nomic-embed-text on 1060) ──
  - model_name: embeddings-local
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

litellm_settings:
  drop_params: true
  request_timeout: 60

general_settings:
  # master key for the proxy itself (CHANGE in real deploy)
  master_key: CHANGE_ME_LITELLM_MASTER
